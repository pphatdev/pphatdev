name: Daily README Update

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bar_style:
        description: 'Progress bar style (block | shade | ascii | dot | arrow | pipe)'
        required: false
        default: 'block'
        type: choice
        options:
          - block
          - shade
          - ascii
          - dot
          - pipe
          - emoji

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README stats
        id: update_stats
        uses: ./
        with:
          waka-token: ${{ secrets.WAKA_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          bar-style: ${{ github.event.inputs.bar_style || 'block' }}

      - name: Commit and push changes
        id: commit
        if: steps.update_stats.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(readme): update daily stats, followers and blog posts"
          file_pattern: "README.md data/coding_stats.json"
          branch: main

      - name: Notify Telegram on success
        if: success() && steps.update_stats.outputs.changed == 'true'
        uses: pphatdev/telegrambot-alert-action@v1.1-beta
        with:
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          stage: Daily README Update
          environment: production
          extra: "<b>Repo:</b> ${{ github.repository }}\n<b>Trigger:</b> ${{ github.event_name }}"

      - name: Notify Telegram on failure
        if: failure()
        uses: pphatdev/telegrambot-alert-action@v1.1-beta
        with:
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          stage: Daily README Update
          environment: production
          extra: "<b>Repo:</b> ${{ github.repository }}\n<b>Run:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"






